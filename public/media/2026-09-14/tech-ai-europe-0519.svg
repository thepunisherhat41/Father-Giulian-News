<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
<title id="title">Venda em ações de IA chega à Europa</title>
<desc id="desc">Arte editorial vertical com as quedas de Infineon, ASMI e ASML reportadas pela Reuters em 14 de setembro de 2026.</desc>
<rect width="1080" height="1920" fill="#111827"/>
<rect x="72" y="92" width="936" height="1736" rx="54" fill="#f8fafc"/>
<text x="132" y="250" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#111827">VENDA EM AÇÕES DE IA</text>
<text x="132" y="318" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#111827">CHEGA À EUROPA</text>
<text x="132" y="390" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#475569">Setor europeu de tecnologia: -1,4%</text>
<line x1="132" y1="470" x2="948" y2="470" stroke="#cbd5e1" stroke-width="3"/>
<text x="132" y="615" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#111827">Infineon</text>
<rect x="132" y="660" width="704" height="86" rx="18" fill="#334155"/>
<text x="866" y="720" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#111827">-5,8%</text>
<text x="132" y="885" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#111827">ASMI</text>
<rect x="132" y="930" width="607" height="86" rx="18" fill="#475569"/>
<text x="866" y="990" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#111827">-5,0%</text>
<text x="132" y="1155" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#111827">ASML</text>
<rect x="132" y="1200" width="534" height="86" rx="18" fill="#64748b"/>
<text x="866" y="1260" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#111827">-4,4%</text>
<line x1="132" y1="1405" x2="948" y2="1405" stroke="#cbd5e1" stroke-width="3"/>
<text x="132" y="1510" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111827">ATUALIZAÇÃO</text>
<text x="132" y="1570" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#475569">A pressão registrada primeiro na Ásia</text>
<text x="132" y="1614" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#475569">se espalhou para as bolsas europeias.</text>
<text x="132" y="1740" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#64748b">Dados: Reuters · mercado da manhã</text>
</svg>
