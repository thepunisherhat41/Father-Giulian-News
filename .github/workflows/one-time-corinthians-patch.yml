name: One-time Corinthians feed patch
on:
  push:
    branches:
      - fix/hard-publish-gate-20260829
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: include current Corinthians in news feed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hard-publish-gate-20260829
      - name: Patch current feed in editorial order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/ReelsExperienceV26.tsx')
          s=p.read_text()
          old="const news=['brasil','mundo','politica','tempo','seguranca-zl'].map(journalisticReel)"
          new="const news=['brasil','mundo','politica','tempo','seguranca-zl','corinthians'].map(journalisticReel)"
          if old not in s:
              raise SystemExit('target news array not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/ReelsExperienceV26.tsx
          git commit -m "fix: include current Corinthians in news feed"
          git push origin HEAD:fix/hard-publish-gate-20260829
