name: Father News 6 - Fresh 25 Media Snapshot QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/candidates/2026-10-23/**'
      - 'scripts/v6-build-daily-media-candidate.py'
      - 'scripts/v6-verify-daily-media-candidate.py'
      - 'scripts/v6-safe-extract-staging.py'
      - '.github/workflows/father-news-v6-daily-media-23-oct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-25-media:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact image processing dependency
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq librsvg2-bin
          python -m py_compile scripts/v6-build-daily-media-candidate.py scripts/v6-verify-daily-media-candidate.py
      - name: Freeze new day imagery; no DB or Storage writes
        env:
          APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/v6-build-daily-media-candidate.py \
            --edition data/candidates/2026-10-23/edition-v2.json \
            --photos data/candidates/2026-10-23/media-2026-10-23.json \
            --output /tmp/father-v6-daily-23 \
            --release-id 2026-10-23-r01 --app-sha "$APP_SHA"
          python scripts/v6-verify-daily-media-candidate.py \
            --root /tmp/father-v6-daily-23 \
            --edition data/candidates/2026-10-23/edition-v2.json \
            --photos data/candidates/2026-10-23/media-2026-10-23.json \
            --app-sha "$APP_SHA"
      - name: Strict semantic and provenance validation of v6 manifest
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {validateEdition} from './lib/father-v6/engine.mjs';
          const root='/tmp/father-v6-daily-23/';
          const index=JSON.parse(readFileSync(root+'candidate-media-manifest.json','utf8'));
          const manifest=JSON.parse(readFileSync(root+index.manifest_path,'utf8'));
          const report=validateEdition(manifest);
          if(!report.ok || report.cardCount!==25 || report.mediaCount!==25){
            console.error(report);process.exit(1);
          }
          console.log('PASS: 25/25 fresh 23 Oct v6 manifest semantic, source provenance and media integrity.');
          NODE
      - name: Save and independently re-extract STAGING-ONLY exact bytes
        env:
          APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tar -czf /tmp/father-v6-daily-23.tar.gz -C /tmp/father-v6-daily-23 .
          python scripts/v6-safe-extract-staging.py /tmp/father-v6-daily-23.tar.gz /tmp/father-v6-independent-extract
          python scripts/v6-verify-daily-media-candidate.py \
            --root /tmp/father-v6-independent-extract \
            --edition data/candidates/2026-10-23/edition-v2.json \
            --photos data/candidates/2026-10-23/media-2026-10-23.json \
            --app-sha "$APP_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: father-v6-fresh-23-oct-exact-bytes-staging-only
          path: /tmp/father-v6-daily-23.tar.gz
          retention-days: 14
