name: Father News 6 - Editorial Candidate 22 October
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/candidates/2026-10-22/**'
      - 'scripts/quality-v2.mjs'
      - '.github/workflows/father-news-v6-candidate-22-oct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-22-oct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Daily editorial hard gate against isolated source candidate
        run: |
          node scripts/quality-v2.mjs \
            data/candidates/2026-10-22/edition-v2.json \
            data/candidates/2026-10-22/media-2026-10-22.json
      - name: Independently verify count, reporting dates and photo attribution
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const ed=JSON.parse(readFileSync('data/candidates/2026-10-22/edition-v2.json','utf8'));
          const photos=JSON.parse(readFileSync('data/candidates/2026-10-22/media-2026-10-22.json','utf8'));
          assert.equal(ed.editionDate,'2026-10-22');
          assert.equal(ed.cards.length,25);
          assert.equal(new Set(ed.cards.map(c=>c.id)).size,25);
          const news=ed.cards.filter(c=>c.news);
          assert.ok(news.length>=6);
          for(const c of news){
            assert.equal(c.eventDate,'2026-10-22',c.id);
            assert.ok(c.sources.length,c.id);
            for(const s of c.sources) {
              assert.match(s.url,/^https:\/\//,c.id);
              assert.match(s.publishedAt||'',/^\d{4}-\d{2}-\d{2}$/,c.id);
              assert.ok(s.publishedAt<=ed.editionDate,c.id);
            }
          }
          for(const id of ['papo','desafio','cur-ciencia','cur-espaco','cur-natureza','cur-historia']){
            const candidate=ed.cards.find(c=>c.id===id);
            const previous=JSON.parse(readFileSync('data/current-edition.json','utf8')).cards.find(c=>c.id===id);
            assert.notEqual(candidate.conceptId,previous.conceptId,id);
            assert.notEqual(candidate.visualConceptId,previous.visualConceptId,id);
            assert.notEqual(candidate.title,previous.title,id);
          }
          for(const photo of Object.values(photos)) {
            assert.match(photo.url,/^https:\/\//);
            assert.match(photo.source,/^https:\/\//);
            assert.ok(photo.credit?.length>=4 && photo.license?.length>=3);
          }
          assert.equal(Object.keys(photos).length,12);
          console.log('PASS: 25/25 dated candidate cards; news-source dates and novel creative fingerprints verified. MEDIA NOT FROZEN OR PUBLISHED.');
          NODE
