name: Father News 6 Atomic Engine - Isolated Tests
on:
  pull_request:
    paths:
      - 'lib/father-v6/**'
      - 'tests/v6-engine.test.mjs'
      - 'tests/v6-postgres-integration.py'
      - 'scripts/v6-readiness.mjs'
      - 'docs/architecture/proposed_supabase_v6_migration.sql'
      - '.github/workflows/father-news-v6-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test atomic engine and fail-closed paths
        run: node --test tests/v6-engine.test.mjs
      - name: Legacy media readiness report
        run: node scripts/v6-readiness.mjs
      - name: Assert migration stays inactive
        run: |
          node scripts/v6-readiness.mjs | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const x=JSON.parse(s);if(x.status!=='MIGRATION_NOT_READY'||x.releaseActivated!==false)process.exit(1)})"

  postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: temporary-ci-password
          POSTGRES_DB: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U ubuntu -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "55433"
      PGUSER: ubuntu
      PGPASSWORD: temporary-ci-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Provision test-only roles and apply SQL migration
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN"
          psql -X -v ON_ERROR_STOP=1 -f docs/architecture/proposed_supabase_v6_migration.sql
      - name: Test concurrent CAS, RLS, rollback and audit on real PostgreSQL
        run: python3 tests/v6-postgres-integration.py
