name: Father News 6 Read-Only API Tests
on:
  pull_request:
    paths:
      - 'app/api/edition/current/route.js'
      - 'tests/v6-reader-api.test.mjs'
      - '.github/workflows/father-news-v6-reader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/v6-reader-api.test.mjs
