name: Father News V2 Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-build-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Editorial quality
        run: npm run quality
      - name: Production build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Local production server
        run: |
          mkdir -p artifacts
          npm run start >/tmp/father-news.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:3000 >/dev/null
      - name: Chromium 390x844 ALL reels
        run: npx playwright test tests/mobile-v2.spec.ts --reporter=line
      - name: Screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: father-news-v2-mobile-evidence
          path: |
            artifacts/
            test-results/
