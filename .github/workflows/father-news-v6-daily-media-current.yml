name: Father News 6 - Current Edition Immutable Media Candidate QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/current-edition.json'
      - 'data/media-*.json'
      - 'data/candidates/**'
      - 'scripts/v6-resolve-daily-candidate.mjs'
      - 'tests/v6-daily-binding.test.mjs'
      - 'scripts/v6-build-daily-media-candidate.py'
      - 'scripts/v6-verify-daily-media-candidate.py'
      - '.github/workflows/father-news-v6-daily-media-current.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-25-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Bind edition to today's Sao Paulo date and exact checked-in bytes
        run: |
          node --test tests/v6-daily-binding.test.mjs
          node scripts/v6-resolve-daily-candidate.mjs
      - name: Install exact image dependencies, no services or production writes
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq librsvg2-bin
          python -m py_compile scripts/v6-build-daily-media-candidate.py scripts/v6-verify-daily-media-candidate.py
      - name: Check today's verified source edition and media catalogue
        run: |
          node scripts/quality-v2.mjs "$FATHER_V6_CANDIDATE_EDITION" "$FATHER_V6_CANDIDATE_MEDIA"
          node scripts/quality-v2.mjs data/current-edition.json "$FATHER_V6_ROOT_MEDIA"
      - name: Freeze immutable 25 media STAGING ONLY
        env:
          APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/v6-build-daily-media-candidate.py \
            --edition "$FATHER_V6_CANDIDATE_EDITION" \
            --photos "$FATHER_V6_CANDIDATE_MEDIA" \
            --output /tmp/father-v6-daily-current \
            --release-id "$FATHER_V6_RELEASE_ID" --app-sha "$APP_SHA"
          python scripts/v6-verify-daily-media-candidate.py \
            --root /tmp/father-v6-daily-current \
            --edition "$FATHER_V6_CANDIDATE_EDITION" \
            --photos "$FATHER_V6_CANDIDATE_MEDIA" --app-sha "$APP_SHA"
      - name: Validate all 25 media and editorial provenance
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {validateEdition} from './lib/father-v6/engine.mjs';
          const dir='/tmp/father-v6-daily-current/';
          const meta=JSON.parse(readFileSync(dir+'candidate-media-manifest.json','utf8'));
          const manifest=JSON.parse(readFileSync(dir+meta.manifest_path,'utf8'));
          const result=validateEdition(manifest);
          if(!result.ok||result.cardCount!==25||result.mediaCount!==25){
            console.error(result);process.exit(1);
          }
          console.log('Exact SHA STAGING manifest: 25/25 validated');
          NODE
      - name: Re-extract and independently verify tar source bytes
        env:
          APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tar -czf /tmp/father-v6-daily-current.tar.gz -C /tmp/father-v6-daily-current .
          python scripts/v6-safe-extract-staging.py /tmp/father-v6-daily-current.tar.gz /tmp/father-v6-independent-extract
          python scripts/v6-verify-daily-media-candidate.py \
            --root /tmp/father-v6-independent-extract \
            --edition "$FATHER_V6_CANDIDATE_EDITION" \
            --photos "$FATHER_V6_CANDIDATE_MEDIA" --app-sha "$APP_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: father-v6-fresh-current-exact-bytes-staging-only
          path: /tmp/father-v6-daily-current.tar.gz
          retention-days: 14
